<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry, Aditi 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#ffe1ea;
    --pink:#ffb6c8;
    --deep-pink:#ff8fab;
    --lavender:#d8c9ff;
    --mint:#bdeee0;
    --cream:#fff9f5;
    --plum:#5b4b66;
    --plum-soft:#8a768f;
    --gold:#ffd88a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    background:linear-gradient(160deg,var(--cream) 0%,var(--blush) 45%,var(--lavender) 100%);
    font-family:'Quicksand',sans-serif;
    color:var(--plum);
  }

  /* ---------- floating background layer ---------- */
  #bg-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }

  .petal{
    position:absolute;
    top:-40px;
    width:16px;
    height:16px;
    background:var(--pink);
    border-radius:0 60% 0 60%;
    opacity:0.85;
    animation-name:fall, sway;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
  }

  @keyframes fall{
    from{ transform:translateY(-5vh) rotate(0deg); }
    to{ transform:translateY(110vh) rotate(360deg); }
  }
  @keyframes sway{
    0%,100%{ margin-left:0px; }
    50%{ margin-left:40px; }
  }

  .sparkle{
    position:absolute;
    width:6px;
    height:6px;
    background:var(--gold);
    border-radius:50%;
    box-shadow:0 0 6px 2px rgba(255,216,138,0.8);
    animation:twinkle 2.4s ease-in-out infinite;
  }

  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(0.4); }
    50%{ opacity:1; transform:scale(1); }
  }

  /* ---------- main stage ---------- */
  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px 70px;
    text-align:center;
  }

  .title{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(28px,6vw,46px);
    color:var(--deep-pink);
    text-shadow:2px 2px 0 #fff, 0 0 18px rgba(255,143,171,0.4);
    margin:0 0 6px;
    opacity:0;
    animation:popIn 0.9s 0.2s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .subtitle{
    font-size:15px;
    color:var(--plum-soft);
    margin:0 0 28px;
    opacity:0;
    animation:popIn 0.9s 0.5s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes popIn{
    from{ opacity:0; transform:translateY(-14px) scale(0.9); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ---------- chibi character ---------- */
  .chibi-wrap{
    position:relative;
    width:180px;
    height:180px;
    margin-bottom:10px;
    animation:bob 3.2s ease-in-out infinite;
  }

  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-1deg); }
    50%{ transform:translateY(-10px) rotate(1deg); }
  }

  .chibi svg{ width:100%; height:100%; overflow:visible; }

  .eye{
    animation:blink 4.5s infinite;
    transform-origin:center;
  }
  .eye.right{ animation-delay:0.05s; }

  @keyframes blink{
    0%,92%,100%{ transform:scaleY(1); }
    95%{ transform:scaleY(0.1); }
  }

  .tear{
    opacity:0;
    animation:cry 3.5s ease-in infinite;
  }
  .tear.t2{ animation-delay:1.2s; }

  @keyframes cry{
    0%{ opacity:0; transform:translateY(0); }
    15%{ opacity:1; }
    70%{ opacity:0.9; transform:translateY(22px); }
    100%{ opacity:0; transform:translateY(26px); }
  }

  .heart-float{
    position:absolute;
    font-size:14px;
    opacity:0;
    animation:heartUp 2.6s ease-in infinite;
  }
  .heart-float.h1{ left:10px; top:20px; animation-delay:0s; }
  .heart-float.h2{ right:6px; top:40px; animation-delay:1.1s; }
  .heart-float.h3{ left:50%; top:0; animation-delay:2s; }

  @keyframes heartUp{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }
    20%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-46px) scale(1.1); }
  }

  /* ---------- speech / message bubble ---------- */
  .bubble{
    position:relative;
    max-width:420px;
    width:100%;
    background:#fff;
    border-radius:26px;
    padding:26px 24px 22px;
    box-shadow:0 14px 30px rgba(255,143,171,0.25), 0 0 0 3px var(--blush) inset;
    margin-top:6px;
  }

  .bubble::before{
    content:"";
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    border-width:0 12px 14px 12px;
    border-style:solid;
    border-color:transparent transparent #fff transparent;
  }

  #typed-text{
    font-size:16px;
    line-height:1.7;
    min-height:110px;
    text-align:left;
    white-space:pre-wrap;
  }

  .cursor{
    display:inline-block;
    width:2px;
    background:var(--deep-pink);
    margin-left:2px;
    animation:blinkCursor 0.8s steps(1) infinite;
  }
  @keyframes blinkCursor{ 50%{ opacity:0; } }

  .signature{
    display:block;
    margin-top:14px;
    font-family:'Baloo 2',cursive;
    font-size:14px;
    color:var(--pink);
    text-align:right;
    opacity:0;
  }
  .signature.show{
    opacity:1;
    animation:popIn 0.6s ease forwards;
  }

  /* ---------- button ---------- */
  .btn-row{
    margin-top:30px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    min-height:56px;
  }

  .forgive-btn{
    font-family:'Baloo 2',cursive;
    font-size:16px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,var(--deep-pink),var(--pink));
    border:none;
    padding:14px 30px;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(255,143,171,0.45);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    opacity:0;
    animation:popIn 0.7s 2.6s cubic-bezier(.34,1.56,.64,1) forwards;
    position:relative;
  }
  .forgive-btn:hover{
    transform:translateY(-3px) scale(1.04);
    box-shadow:0 12px 22px rgba(255,143,171,0.55);
  }
  .forgive-btn:active{ transform:translateY(0) scale(0.98); }

  .maybe-btn{
    font-family:'Quicksand',sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--plum-soft);
    background:#fff;
    border:2px solid var(--lavender);
    padding:12px 22px;
    border-radius:50px;
    cursor:pointer;
    transition:transform 0.12s ease;
    opacity:0;
    animation:popIn 0.7s 2.8s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .maybe-btn:hover{ transform:translateY(-2px); }

  /* ---------- final celebration state ---------- */
  .final-msg{
    margin-top:22px;
    font-family:'Baloo 2',cursive;
    font-size:22px;
    color:var(--deep-pink);
    display:none;
  }
  .final-msg.show{
    display:block;
    animation:popIn 0.7s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .confetti-piece{
    position:fixed;
    top:-10px;
    z-index:5;
    border-radius:2px;
    pointer-events:none;
  }

  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(720deg); opacity:0.2; }
  }

  footer{
    position:relative;
    z-index:1;
    padding-bottom:20px;
    font-size:12px;
    color:var(--plum-soft);
    opacity:0.8;
  }

  @media (max-width:480px){
    .bubble{ padding:20px 18px 18px; }
    #typed-text{ font-size:15px; }
  }
</style>
</head>
<body>

<div id="bg-layer"></div>

<div class="stage">
  <div class="title">I'm sorry, Aditi 🌸</div>
  <div class="subtitle">a small apology, made with a lot of feelings</div>

  <div class="chibi-wrap">
    <span class="heart-float h1">💗</span>
    <span class="heart-float h2">💕</span>
    <span class="heart-float h3">💞</span>
    <div class="chibi">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- hair back -->
        <path d="M40 95 Q30 40 100 30 Q170 40 160 95 L160 120 Q140 100 100 100 Q60 100 40 120 Z" fill="#5b4b66"/>
        <!-- face -->
        <ellipse cx="100" cy="105" rx="58" ry="55" fill="#ffe9d9"/>
        <!-- blush -->
        <ellipse cx="66" cy="118" rx="12" ry="7" fill="#ffb6c8" opacity="0.8"/>
        <ellipse cx="134" cy="118" rx="12" ry="7" fill="#ffb6c8" opacity="0.8"/>
        <!-- eyes (sad/closed-ish, anime style) -->
        <g class="eye left">
          <path d="M62 100 Q75 90 90 100" stroke="#5b4b66" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        <g class="eye right">
          <path d="M110 100 Q125 90 138 100" stroke="#5b4b66" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        <!-- mouth: small sorry pout -->
        <path d="M92 138 Q100 132 108 138" stroke="#a9748a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- tears -->
        <ellipse class="tear t1" cx="62" cy="112" rx="4" ry="7" fill="#bfe3ff"/>
        <ellipse class="tear t2" cx="138" cy="112" rx="4" ry="7" fill="#bfe3ff"/>
        <!-- hair front tufts -->
        <path d="M45 70 Q55 35 100 32 Q145 35 155 70 Q140 55 100 55 Q60 55 45 70 Z" fill="#6b5877"/>
        <circle cx="100" cy="20" r="6" fill="#6b5877"/>
      </svg>
    </div>
  </div>

  <div class="bubble">
    <div id="typed-text"></div>
    <span class="signature" id="signature">— with all my heart</span>
  </div>

  <div class="btn-row" id="btnRow">
    <button class="forgive-btn" id="forgiveBtn">Forgive me? 🥺💗</button>
    <button class="maybe-btn" id="maybeBtn">hmm, maybe...</button>
  </div>

  <div class="final-msg" id="finalMsg">Yay!! Thank you, Aditi 🎉💖 I love you so much!</div>
</div>

<footer>made just for you, Aditi 🌷</footer>

<script>
  // ---------- background petals & sparkles ----------
  const bgLayer = document.getElementById('bg-layer');
  const petalCount = 22;
  for(let i=0;i<petalCount;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const left = Math.random()*100;
    const size = 8 + Math.random()*10;
    const duration = 7 + Math.random()*8;
    const swayDur = 2 + Math.random()*3;
    const delay = Math.random()*10;
    const hueChoices = ['#ffb6c8','#ffd1dc','#ffc9de','#f7a8c4'];
    p.style.left = left+'vw';
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.background = hueChoices[Math.floor(Math.random()*hueChoices.length)];
    p.style.animationDuration = duration+'s, '+swayDur+'s';
    p.style.animationDelay = '-'+delay+'s, -'+(Math.random()*swayDur)+'s';
    bgLayer.appendChild(p);
  }

  const sparkleCount = 16;
  for(let i=0;i<sparkleCount;i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (Math.random()*100)+'vh';
    s.style.animationDelay = (Math.random()*2.4)+'s';
    bgLayer.appendChild(s);
  }

  // ---------- typing effect ----------
  const message = "Hey Aditi... I know I messed up, and I just want you to know how sorry I really am. You mean the world to me, and seeing you upset makes my heart hurt. I promise to do better, listen more, and never make you feel this way again. Please forgive me? 🌸💗";
  const typedEl = document.getElementById('typed-text');
  const signatureEl = document.getElementById('signature');
  let idx = 0;

  function typeWriter(){
    if(idx <= message.length){
      typedEl.innerHTML = message.slice(0, idx) + '<span class="cursor">&nbsp;</span>';
      idx++;
      setTimeout(typeWriter, 28);
    } else {
      typedEl.innerHTML = message;
      signatureEl.classList.add('show');
    }
  }
  setTimeout(typeWriter, 700);

  // ---------- maybe button dodges the cursor ----------
  const maybeBtn = document.getElementById('maybeBtn');
  const btnRow = document.getElementById('btnRow');
  let dodgeCount = 0;

  function dodge(){
    dodgeCount++;
    const rowRect = btnRow.getBoundingClientRect();
    const maxX = Math.min(140, rowRect.width - 100);
    const randX = (Math.random()-0.5) * 2 * maxX;
    const randY = (Math.random()-0.5) * 30;
    maybeBtn.style.transform = `translate(${randX}px, ${randY}px)`;
    if(dodgeCount >= 4){
      maybeBtn.textContent = "okay okay, fine 🥹";
    }
    if(dodgeCount >= 7){
      maybeBtn.textContent = "you found me 😳";
      maybeBtn.style.transition = 'transform 0.2s ease';
    }
  }
  maybeBtn.addEventListener('mouseenter', dodge);
  maybeBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodge(); });

  // ---------- forgive button: confetti + hearts burst ----------
  const forgiveBtn = document.getElementById('forgiveBtn');
  const finalMsg = document.getElementById('finalMsg');

  function burstConfetti(){
    const colors = ['#ff8fab','#ffb6c8','#d8c9ff','#bdeee0','#ffd88a'];
    for(let i=0;i<60;i++){
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      const size = 6 + Math.random()*6;
      c.style.width = size+'px';
      c.style.height = (size*0.4 + Math.random()*4)+'px';
      c.style.left = (Math.random()*100)+'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      const fallDuration = 2.2 + Math.random()*1.8;
      c.style.animation = `confettiFall ${fallDuration}s ease-in forwards`;
      c.style.opacity = '1';
      document.body.appendChild(c);
      setTimeout(()=> c.remove(), fallDuration*1000 + 200);
    }
  }

  function burstHearts(originEl){
    const rect = originEl.getBoundingClientRect();
    const emojis = ['💖','💕','💗','💘','✨'];
    for(let i=0;i<18;i++){
      const h = document.createElement('div');
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.position = 'fixed';
      h.style.left = (rect.left + rect.width/2)+'px';
      h.style.top = (rect.top)+'px';
      h.style.fontSize = (14+Math.random()*14)+'px';
      h.style.pointerEvents = 'none';
      h.style.zIndex = 6;
      const angle = Math.random()*Math.PI*2;
      const dist = 60 + Math.random()*120;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist - 60;
      h.style.transition = 'transform 1.1s cubic-bezier(.2,.8,.3,1), opacity 1.1s ease';
      document.body.appendChild(h);
      requestAnimationFrame(()=>{
        h.style.transform = `translate(${dx}px, ${dy}px) scale(1.3)`;
        h.style.opacity = '0';
      });
      setTimeout(()=> h.remove(), 1200);
    }
  }

  forgiveBtn.addEventListener('click', ()=>{
    burstConfetti();
    burstHearts(forgiveBtn);
    finalMsg.classList.add('show');
    forgiveBtn.disabled = true;
    maybeBtn.disabled = true;
    forgiveBtn.style.opacity = '0.9';
    forgiveBtn.textContent = "Yay! 💗";
    document.querySelector('.title').textContent = "Thank you, Aditi 🌸";
    document.querySelector('.subtitle').textContent = "you just made my whole day better";
  });
</script>

</body>
</html>
